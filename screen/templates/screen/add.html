{% extends "screen/base.html" %}

{% block title %}Add Post · SSS{% endblock %}

{% block content %}
    <h1>Add post</h1>
    <p class="sub">Publish a new update to the SSS operations feed.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save post</button>
        <a class="btn btn-line" href="{% url 'home' %}" style="margin-left:.5rem;">Cancel</a>
    </form>
{% endblock %}
