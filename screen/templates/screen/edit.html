{% extends "screen/base.html" %}

{% block title %}Edit Post · SSS{% endblock %}

{% block content %}
    <h1>Edit post</h1>
    <p class="sub">Update your post details and media.</p>
    {% if post.image %}
        <div class="form-preview">
            <img src="{{ post.image.url }}" alt="{{ post.title }}">
        </div>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update</button>
        <a class="btn btn-line" href="{% url 'post_detail' post.id %}" style="margin-left:.5rem;">Cancel</a>
    </form>
{% endblock %}
