<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · SSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..620;1,9..144,500..620&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#16303a; --muted:#5d7380; --deep:#1c5568; --line:#e3eeea; --danger:#b42318; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Manrope, system-ui, sans-serif; color: var(--ink);
      background:
        radial-gradient(800px 420px at 100% 0%, rgba(79,156,179,.2), transparent 50%),
        #f4f7f6;
      display: grid; place-items: center; padding: 1.5rem;
    }
    .card {
      width: min(440px, 100%);
      background: #fff; border: 1px solid var(--line); border-radius: 28px;
      padding: 2rem 1.6rem 1.6rem;
      box-shadow: 0 24px 60px rgba(22,48,58,.08);
    }
    a.back { color: var(--deep); font-weight: 650; text-decoration: none; font-size: .9rem; }
    h1 {
      margin: 1rem 0 .3rem;
      font-family: Fraunces, Georgia, serif;
      font-weight: 560; font-size: 2.4rem; letter-spacing: -.03em;
    }
    .sub { margin: 0 0 1.3rem; color: var(--muted); }
    label { display: block; margin: 0 0 .35rem; font-size: .86rem; font-weight: 700; }
    input[type="text"], input[type="password"] {
      width: 100%; margin-bottom: .95rem; padding: .9rem 1rem;
      border: 1px solid var(--line); border-radius: 14px; background: #f7fbfb; font: inherit;
    }
    input:focus { outline: none; border-color: #28748C; box-shadow: 0 0 0 4px rgba(40,116,140,.16); background: #fff; }
    .row { display: flex; justify-content: space-between; gap: 1rem; margin: 0 0 1.1rem; font-size: .88rem; }
    .row a { color: var(--deep); font-weight: 700; text-decoration: none; }
    .remember { display: flex; align-items: center; gap: .4rem; color: var(--muted); margin: 0; font-weight: 600; }
    button {
      width: 100%; border: 0; border-radius: 999px; padding: .95rem;
      font: inherit; font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(180deg, #3d93ab, var(--deep));
      box-shadow: 0 10px 24px rgba(40,116,140,.28);
    }
    .foot { margin: 1.15rem 0 0; text-align: center; color: var(--muted); }
    .foot a { color: var(--deep); font-weight: 750; text-decoration: none; }
    .errorlist { color: var(--danger); padding-left: 1.1rem; margin: 0 0 .7rem; }
  </style>
</head>
<body>
  <main class="card">
    <a class="back" href="{% url 'landing' %}">← Schedule Sync Service</a>
    <h1>Sign in</h1>
    <p class="sub">Access your SSS account.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}
      <label for="id_username">Username</label>
      {{ form.username }}
      {{ form.username.errors }}
      <label for="id_password">Password</label>
      {{ form.password }}
      {{ form.password.errors }}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="row">
        <label class="remember"><input type="checkbox" name="remember" value="1"> Remember me</label>
        <a href="{% url 'password_reset' %}">Forgot password?</a>
      </div>
      <button type="submit">Log in</button>
    </form>
    <p class="foot">New to SSS? <a href="{% url 'signup' %}">Create an account</a></p>
  </main>
</body>
</html>
