<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password · SSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,144,560,40,0;1,144,520,70,1&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#16303a; --muted:#5d7380; --deep:#1c5568; --line:#e3eeea; --danger:#b42318; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Manrope, system-ui, sans-serif; font-weight: 500; line-height: 1.6;
      -webkit-font-smoothing: antialiased; color: var(--ink);
      background:
        radial-gradient(800px 420px at 100% 0%, rgba(79,156,179,.2), transparent 50%),
        #f4f7f6;
      display: grid; place-items: center; padding: 1.5rem;
    }
    .card {
      width: min(440px, 100%);
      background: #fff; border: 1px solid var(--line); border-radius: 28px;
      padding: 2rem 1.6rem 1.6rem;
      box-shadow: 0 24px 60px rgba(22,48,58,.08);
    }
    a.back { color: var(--deep); font-weight: 650; text-decoration: none; font-size: .9rem; }
    h1 {
      margin: 1rem 0 .3rem;
      font-family: Fraunces, Georgia, serif;
      font-weight: 560; font-size: 2.4rem; letter-spacing: -.03em;
    }
    .sub { margin: 0 0 1.3rem; color: var(--muted); }
    label { display: block; margin: 0 0 .35rem; font-size: .86rem; font-weight: 700; }
    input[type="email"] {
      width: 100%; margin-bottom: .95rem; padding: .9rem 1rem;
      border: 1px solid var(--line); border-radius: 14px; background: #f7fbfb; font: inherit;
    }
    input:focus { outline: none; border-color: #28748C; box-shadow: 0 0 0 4px rgba(40,116,140,.16); background: #fff; }
    button {
      width: 100%; border: 0; border-radius: 999px; padding: .95rem;
      font: inherit; font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(180deg, #3d93ab, var(--deep));
      box-shadow: 0 10px 24px rgba(40,116,140,.28);
    }
    .foot { margin: 1.15rem 0 0; text-align: center; color: var(--muted); }
    .foot a { color: var(--deep); font-weight: 750; text-decoration: none; }
    .errorlist { color: var(--danger); padding-left: 1.1rem; margin: 0 0 .7rem; }
  </style>
</head>
<body>
  <main class="card">
    <a class="back" href="{% url 'login' %}">← Sign in</a>
    <h1>Reset password</h1>
    <p class="sub">Enter the email on your SSS account. We will send a link to choose a new password.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <label for="id_email">Email</label>
      {{ form.email }}
      {{ form.email.errors }}
      <button type="submit">Send reset link</button>
    </form>
    <p class="foot"><a href="{% url 'landing' %}">Back to Schedule Sync Service</a></p>
  </main>
</body>
</html>
