<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check your email · SSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,144,560,40,0;1,144,520,70,1&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#16303a; --muted:#5d7380; --deep:#1c5568; --line:#e3eeea; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Manrope, system-ui, sans-serif; font-weight: 500; line-height: 1.6;
      -webkit-font-smoothing: antialiased; color: var(--ink);
      background:
        radial-gradient(800px 420px at 100% 0%, rgba(79,156,179,.2), transparent 50%),
        #f4f7f6;
      display: grid; place-items: center; padding: 1.5rem;
    }
    .card {
      width: min(440px, 100%);
      background: #fff; border: 1px solid var(--line); border-radius: 28px;
      padding: 2rem 1.6rem 1.6rem;
      box-shadow: 0 24px 60px rgba(22,48,58,.08);
    }
    h1 {
      margin: 0 0 .4rem;
      font-family: Fraunces, Georgia, serif;
      font-weight: 560; font-size: 2.4rem; letter-spacing: -.03em;
    }
    p { margin: 0; color: var(--muted); }
    .foot { margin: 1.3rem 0 0; }
    .foot a { color: var(--deep); font-weight: 750; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Check your email</h1>
    <p>If an SSS account uses that address, a reset link is on its way.</p>
    <p class="foot"><a href="{% url 'login' %}">Back to sign in</a></p>
  </main>
</body>
</html>
